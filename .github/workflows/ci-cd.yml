name: CI/CD Pipeline - Campus Hub Pro

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Linting & Build Verification
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Code Analysis
        working-directory: ./frontend
        run: npm run lint

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: Backend Compilation & Automated Tests
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Test & Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        working-directory: ./backend
        run: chmod +x gradlew

      - name: Run Spring Boot Integration Tests
        working-directory: ./backend
        run: ./gradlew test --no-daemon

      - name: Generate Test Report Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: backend/build/reports/tests/test/
          retention-days: 7

      - name: Package Boot JAR
        working-directory: ./backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Docker Images Build & Smoke Verification
  # -------------------------------------------------------------
  docker-verify:
    name: Docker Container Validation
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: campushub-backend:latest
          load: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: campushub-frontend:latest
          load: true

      - name: Verify Docker Compose Syntax
        run: |
          docker compose config

  # -------------------------------------------------------------
  # Job 4: Runtime Smoke Test - start stack and probe /actuator/health
  # -------------------------------------------------------------
  runtime-verify:
    name: Runtime Stack Smoke Test
    needs: [docker-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start MySQL and Backend containers
        run: |
          docker compose up -d --build mysql backend
          echo "Waiting for backend healthcheck..."
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' campushub-backend 2>/dev/null || echo starting)
            echo "attempt $i: $state"
            [ "$state" = "healthy" ] && break
            sleep 10
          done

      - name: Probe Actuator Health Endpoint
        run: |
          curl -sS -i http://localhost:8080/actuator/health | tee health-probe.txt
          docker compose ps

      - name: Upload Health Probe Evidence
        uses: actions/upload-artifact@v4
        with:
          name: health-probe
          path: health-probe.txt
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs backend mysql

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------
  # Job 5: Continuous Deployment (CD)
  # -------------------------------------------------------------
  deploy:
    name: Package Release Bundle
    needs: [runtime-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle

      - name: Display Release Information
        run: |
          echo "=========================================================="
          echo "RELEASE BUNDLE FOR THIS COMMIT"
          echo "=========================================================="
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Ref:    ${{ github.ref_name }}"
          find release-bundle -type f -exec ls -lh {} \;

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-bundle
          retention-days: 7

      - name: Deployment Note
        run: |
          echo "Stack is deployed manually with 'docker compose up -d --build'."
          echo "Health probe to verify after startup: curl http://localhost:8080/actuator/health"
